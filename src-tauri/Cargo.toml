[package]
name = "openhistory-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local-only semantic desktop activity history"

[lib]
name = "openhistory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
openhistory-adapters = { path = "../crates/openhistory-adapters" }
openhistory-api = { path = "../crates/openhistory-api" }
openhistory-domain = { path = "../crates/openhistory-domain" }
openhistory-privacy = { path = "../crates/openhistory-privacy" }
openhistory-segmentation = { path = "../crates/openhistory-segmentation" }
openhistory-storage = { path = "../crates/openhistory-storage" }
openhistory-summaries = { path = "../crates/openhistory-summaries" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }

[lints]
workspace = true
