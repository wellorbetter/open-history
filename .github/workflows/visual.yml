name: Visual surfaces

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: openhistory-visual-evidence
          path: |
            artifacts/playwright
            playwright-report
          if-no-files-found: warn
          retention-days: 1
