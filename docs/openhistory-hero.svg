<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">OpenHistory desktop activity timeline</title>
  <desc id="description">A polished product preview showing OpenHistory as a local-only macOS menu-bar and Windows tray timeline.</desc>
  <defs>
