name: Unsigned desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: openhistory-macos-unsigned
          - os: windows-latest
            artifact: openhistory-windows-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Generate checksum and provenance
        shell: pwsh
        run: |
          $binary = Get-ChildItem target/release -File |
            Where-Object { $_.Name -match '^openhistory(-desktop)?(\.exe)?$' } |
            Select-Object -First 1
          if (-not $binary) { throw 'OpenHistory release binary was not produced' }
          $digest = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($binary.Name)" | Set-Content target/release/SHA256SUMS.txt
          @{
            commit = '${{ github.sha }}'
            runner = '${{ matrix.os }}'
            rust = '1.89.0'
            node = '24'
            signed = $false
          } | ConvertTo-Json | Set-Content target/release/BUILD-PROVENANCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/openhistory*
            target/release/SHA256SUMS.txt
            target/release/BUILD-PROVENANCE.json
          if-no-files-found: error
